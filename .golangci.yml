version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    staticcheck:
      # golangci-lint's defaults, minus QF1001: De Morgan rewrites rarely
      # read better than the condition as written.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001

formatters:
  enable:
    - gofmt
