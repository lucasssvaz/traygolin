name: AUR

# Called by the Release workflow after a tag is published. Run it by hand
# to republish: with a version it updates traygolin-bin to that release,
# and it always syncs traygolin-git.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      sha256:
        description: Checksum of the amd64 Arch tarball as built by the Release job.
        type: string
        required: true
      sha256_arm64:
        description: Checksum of the arm64 Arch tarball, if the release includes one.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: Release to publish as traygolin-bin, without the leading v. Leave empty to only sync traygolin-git.
        type: string
        required: false

jobs:
  aur:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v7
      - name: Publish to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          EXPECTED_SHA256_ARM64: ${{ inputs.sha256_arm64 }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not set; skipping AUR publish."
            exit 0
          fi

          # makepkg refuses to run as root.
          useradd -m builder
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pin AUR host keys. `accept-new` is ignored in this container and
          # fails clone with "Host key verification failed."
          install -m644 packaging/aur/known_hosts ~/.ssh/known_hosts
          # echo, not a indented heredoc: YAML would put spaces in front of Host
          # and OpenSSH would ignore the stanza (that is what failed v0.1.0).
          {
            echo "Host aur.archlinux.org"
            echo "  HostName aur.archlinux.org"
            echo "  User aur"
            echo "  IdentityFile $HOME/.ssh/aur"
            echo "  IdentitiesOnly yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          export GIT_SSH_COMMAND="ssh -F $HOME/.ssh/config -o IdentitiesOnly=yes"
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          publish() {
            pkg="$1" msg="$2"
            dir="/tmp/aur-${pkg}"
            git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "$dir"
            cp "packaging/aur/${pkg}/PKGBUILD" "$dir/PKGBUILD"
            if [ "$pkg" = traygolin-bin ]; then
              base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
              sums="$(curl -fsSL "${base}/SHA256SUMS")"
              verify() {
                local name="$1" expected="$2"
                local sum
                sum="$(curl -fsSL "${base}/${name}" | sha256sum | cut -d' ' -f1)"
                if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || [ "$sum" != "$expected" ]; then
                  echo "::error::${name} checksum ${sum} does not match the release's ${expected:-<missing>}"
                  exit 1
                fi
                printf '%s' "$sum"
              }
              tarball_amd64="traygolin-${VERSION}-linux-amd64.tar.gz"
              tarball_arm64="traygolin-${VERSION}-linux-arm64.tar.gz"
              expected_amd64="${EXPECTED_SHA256:-}"
              if [ -z "$expected_amd64" ]; then
                expected_amd64="$(printf '%s\n' "$sums" | awk -v f="$tarball_amd64" '$2 == f {print $1}')"
              fi
              sum_amd64="$(verify "$tarball_amd64" "$expected_amd64")"
              oldver=$(awk -F= '/^pkgver=/ {print $2; exit}' "$dir/PKGBUILD")
              if [ "$oldver" != "$VERSION" ]; then
                sed -i "s/^pkgver=.*/pkgver=${VERSION}/;s/^pkgrel=.*/pkgrel=1/" "$dir/PKGBUILD"
              fi
              sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${sum_amd64}')/" "$dir/PKGBUILD"
              grep -qx "sha256sums_x86_64=('${sum_amd64}')" "$dir/PKGBUILD"
              expected_arm64="${EXPECTED_SHA256_ARM64:-}"
              if [ -z "$expected_arm64" ]; then
                expected_arm64="$(printf '%s\n' "$sums" | awk -v f="$tarball_arm64" '$2 == f {print $1}')"
              fi
              if [[ "$expected_arm64" =~ ^[0-9a-f]{64}$ ]] && curl -fsSLI "${base}/${tarball_arm64}" >/dev/null; then
                sum_arm64="$(verify "$tarball_arm64" "$expected_arm64")"
                sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${sum_arm64}')/" "$dir/PKGBUILD"
                grep -qx "sha256sums_aarch64=('${sum_arm64}')" "$dir/PKGBUILD"
              else
                sed -i "s/arch=('x86_64' 'aarch64')/arch=('x86_64')/;/^source_aarch64=/d;/^sha256sums_aarch64=/d" "$dir/PKGBUILD"
              fi
            fi
            chown -R builder "$dir"
            su builder -c "cd '$dir' && makepkg --printsrcinfo > .SRCINFO"
            git -C "$dir" add PKGBUILD .SRCINFO
            if git -C "$dir" diff --cached --quiet; then
              echo "${pkg}: no changes"
              return
            fi
            git -C "$dir" commit -m "$msg"
            git -C "$dir" push origin HEAD:master
          }

          if [ -n "${VERSION}" ]; then
            publish traygolin-bin "Update to v${VERSION}"
          fi
          publish traygolin-git "Sync PKGBUILD from ${GITHUB_SHA::7}"

  verify:
    name: install aur (${{ matrix.cpu }})
    needs: aur
    if: ${{ inputs.version != '' }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: amd64
            runner: ubuntu-latest
            container: archlinux:latest
          - cpu: arm64
            runner: ubuntu-24.04-arm
            container: ghcr.io/fwcd/archlinux
    steps:
      - uses: actions/checkout@v7
      - name: Install traygolin-bin from AUR
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel git gtk4 libadwaita polkit \
            hicolor-icon-theme xorg-server-xvfb dbus sudo desktop-file-utils
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          su - builder -c 'set -euo pipefail
            ok=
            for _ in 1 2 3 4 5 6; do
              if git clone --depth 1 https://aur.archlinux.org/traygolin-bin.git "$HOME/traygolin-bin"; then
                ok=1
                break
              fi
              rm -rf "$HOME/traygolin-bin"
              sleep 10
            done
            test -n "$ok"
            cd "$HOME/traygolin-bin"
            makepkg -si --noconfirm'
          pacman -Qi traygolin-bin
      - name: Smoke-test installed package
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
        run: bash packaging/smoke-installed.sh
