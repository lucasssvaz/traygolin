name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The UI needs libadwaita 1.9 (AdwViewSwitcherSidebar). Hosted Ubuntu
# runners may still be 24.04 (libadwaita 1.5), so jobs run in containers.
# Arch is the original target; Ubuntu 26.04 LTS is the Debian-family one.
# Compiling gotk4's cgo bindings from scratch takes most of a job, so the Go
# build cache is restored between runs and gotk4 is only built one way per job.
env:
  ARCH_DEPS: go gtk4 libadwaita gobject-introspection pkgconf gcc git make xorg-server-xvfb dbus desktop-file-utils
  UBUNTU_DEPS: ca-certificates golang-go gcc libc6-dev pkg-config make git libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev gobject-introspection gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11 dpkg-dev desktop-file-utils
  GOCACHE: /github/home/.cache/go-build
  GOMODCACHE: /github/home/go/pkg/mod

jobs:
  test:
    name: test and build (${{ matrix.os }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: arch
            container: archlinux:latest
          - os: ubuntu
            container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          case "${{ matrix.os }}" in
            arch)
              pacman -Syu --noconfirm --needed ${{ env.ARCH_DEPS }}
              ;;
            ubuntu)
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ${{ env.UBUNTU_DEPS }}
              ;;
            *)
              echo "unknown matrix.os ${{ matrix.os }}"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v7
      - name: Go version
        id: go
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-test-${{ matrix.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-test-${{ matrix.os }}-${{ steps.go.outputs.version }}-
      - name: Build
        run: |
          make
          test -x bin/traygolin
          test -x bin/traygolin-helper
      - name: Smoke-run binaries
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          xvfb-run -a dbus-run-session -- ./bin/traygolin --help | tee /tmp/traygolin-help.out
          grep -q -- '--hide-window' /tmp/traygolin-help.out
          if ./bin/traygolin-helper 2>/tmp/helper.err; then
            echo "traygolin-helper should refuse to run without pkexec"
            cat /tmp/helper.err
            exit 1
          fi
          grep -q 'PKEXEC_UID is not set' /tmp/helper.err
          if PKEXEC_UID=0 ./bin/traygolin-helper 2>/tmp/helper-usage.err; then
            echo "traygolin-helper should fail without a command"
            cat /tmp/helper-usage.err
            exit 1
          fi
          grep -q 'usage: traygolin-helper' /tmp/helper-usage.err
      - name: Test GTK packages
        run: |
          xvfb-run -a go test $(go list -f '{{.ImportPath}} {{join .Deps " "}}' ./... | awk '/diamondburned\/gotk4/ {print $1}')
      - name: Test other packages with the race detector
        # Kept apart so gotk4, which also fails -race's checkptr checks, is
        # not rebuilt with race instrumentation.
        run: |
          go test -race $(go list -f '{{.ImportPath}} {{join .Deps " "}}' ./... | awk '!/diamondburned\/gotk4/ {print $1}')
      - name: Install into staging root
        run: |
          make DESTDIR="$PWD/stage" PREFIX=/usr install
          test -x stage/usr/lib/traygolin/traygolin-helper
          test ! -e stage/usr/share/glib-2.0/schemas/gschemas.compiled
          grep -q '/usr/lib/traygolin/traygolin-helper' stage/usr/share/polkit-1/actions/io.github.lucasssvaz.Traygolin.policy
      - name: Build .deb
        if: matrix.os == 'ubuntu'
        run: |
          bash packaging/debian/build-deb.sh
          dpkg-deb -I traygolin_*.deb
      - name: Install package and smoke-test
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ "${{ matrix.os }}" = ubuntu ]; then
            apt-get install -y ./traygolin_*.deb
          else
            make PREFIX=/usr install
          fi
          bash packaging/smoke-installed.sh

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed ${{ env.ARCH_DEPS }}
      - uses: actions/checkout@v7
      - name: Go version
        id: go
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: go-lint-${{ steps.go.outputs.version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-lint-${{ steps.go.outputs.version }}-
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m

  metainfo:
    name: metainfo validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install appstream
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
      - name: Validate
        run: appstreamcli validate --pedantic --no-net --explain io.github.lucasssvaz.Traygolin.metainfo.xml
